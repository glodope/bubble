<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a1a">
    <title>ПУЗЫРЁК</title>
    <style>
/* ===== RESET ===== */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:none !important; user-select:none; -webkit-user-select:none; }
html,body { width:100%; height:100%; overflow:hidden; background:#0a0a1a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#fff; touch-action:none; }

#game-container { position:fixed; top:0; left:0; width:100%; height:100%; overflow:hidden; }
#game-canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; touch-action:none; transition: filter 0.45s cubic-bezier(0.22,1,0.36,1); }

/* ===== UI ===== */
#ui-layer { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:2; }
#ui-layer .screen { position:fixed; top:0; left:0; width:100%; height:100%; display:none; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#ui-layer .screen.active { display:flex; pointer-events:auto; }

/* ===== GLASS ===== */
.menu-glass { background:rgba(15,15,35,0.88); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.08); border-radius:28px; padding:36px 28px; width:90%; max-width:360px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06); animation:glassIn 0.5s cubic-bezier(0.22,1,0.36,1); }
@keyframes glassIn { from{opacity:0;transform:translateY(30px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }

/* ===== MENU ===== */
.game-title { font-size:46px; font-weight:900; letter-spacing:5px; background:linear-gradient(135deg,#ffd700,#ff8c00,#ff4500); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:6px; filter:drop-shadow(0 2px 8px rgba(255,140,0,0.3)); }
.game-subtitle { font-size:13px; color:rgba(255,255,255,0.45); letter-spacing:7px; margin-bottom:28px; text-transform:uppercase; }
.menu-bubble-demo { width:90px; height:90px; margin:0 auto 28px; border-radius:50%; background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.9),rgba(100,200,255,0.4),rgba(50,100,200,0.2)); box-shadow:0 0 24px rgba(100,200,255,0.25),inset 0 0 24px rgba(255,255,255,0.15); animation:bubbleFloat 3s ease-in-out infinite; position:relative; }
.menu-bubble-demo::after { content:''; position:absolute; top:18%; left:22%; width:22%; height:22%; border-radius:50%; background:rgba(255,255,255,0.8); filter:blur(1px); }
@keyframes bubbleFloat { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-14px) scale(1.05)} }
.best-score { margin-top:22px; font-size:14px; color:rgba(255,255,255,0.45); letter-spacing:1px; }
.best-score span { color:#ffd700; font-weight:700; font-size:20px; }

/* ===== BUTTONS ===== */
.btn { display:block; width:100%; padding:17px; margin:8px 0; border:none; border-radius:18px; font-size:16px; font-weight:700; letter-spacing:2px; cursor:pointer; transition:all 0.15s ease; pointer-events:auto; position:relative; overflow:hidden; }
.btn:active { transform:scale(0.96); }
.btn-primary { background:linear-gradient(135deg,#ff8c00,#ff4500); color:#fff; box-shadow:0 4px 18px rgba(255,69,0,0.3); }
.btn-secondary { background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.8); border:1px solid rgba(255,255,255,0.12); }
.btn-back { background:transparent; color:rgba(255,255,255,0.45); font-size:14px; margin-top:16px; }

/* ===== HUD ===== */
#hud { justify-content:space-between; align-items:center; padding:16px 0 0; pointer-events:none !important; }
#hud * { pointer-events:none !important; }
.hud-center { position:absolute; top:16px; left:50%; transform:translateX(-50%); text-align:center; }
.score-label { display:block; font-size:9px; letter-spacing:4px; color:rgba(255,255,255,0.3); margin-bottom:2px; }
.score-value { font-size:52px; font-weight:900; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,0.6); line-height:1; }
.hud-bottom { position:absolute; bottom:0; left:0; width:100%; padding:0; }
.progress-bar { width:100%; height:3px; background:rgba(255,255,255,0.06); border-radius:0; overflow:hidden; }
.progress-fill { height:100%; width:0%; background:linear-gradient(90deg,#ff8c00,#ffd700); border-radius:0; transition:width 0.3s ease; }

/* ===== GAME OVER ===== */
.dead-title { font-size:34px; font-weight:900; color:#ff4500; letter-spacing:4px; margin-bottom:16px; animation:shake 0.5s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
.dead-bubble { width:60px; height:60px; margin:0 auto 20px; border-radius:50%; background:radial-gradient(circle,rgba(255,100,100,0.3),transparent); border:2px solid rgba(255,100,100,0.5); position:relative; animation:popDead 0.6s ease; }
@keyframes popDead { 0%{transform:scale(1);opacity:1} 50%{transform:scale(1.4);opacity:0.5} 100%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
.final-stats { display:flex; justify-content:space-around; margin:20px 0; padding:16px; background:rgba(0,0,0,0.2); border-radius:16px; }
.stat { text-align:center; }
.stat-label { display:block; font-size:10px; color:rgba(255,255,255,0.4); letter-spacing:2px; margin-bottom:4px; }
.stat-value { font-size:24px; font-weight:900; color:#fff; }

/* ===== SKINS ===== */
.skins-glass { max-height:80vh; overflow-y:auto; padding:24px 16px; }
.screen-title { font-size:24px; font-weight:900; letter-spacing:3px; margin-bottom:8px; }
.coins-display { font-size:18px; color:#ffd700; margin-bottom:16px; font-weight:700; }
.skins-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
.skin-card { aspect-ratio:1; border-radius:18px; background:rgba(255,255,255,0.04); border:2px solid rgba(255,255,255,0.08); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s ease; position:relative; padding:8px; pointer-events:auto; }
.skin-card.active { border-color:#ff8c00; background:rgba(255,140,0,0.08); }
.skin-card.locked { opacity:0.35; }
.skin-card:active { transform:scale(0.95); }
.skin-preview { width:52px; height:52px; border-radius:50%; position:relative; margin-bottom:4px; }
/* Блик на превью */
.skin-preview::after { content:''; position:absolute; top:15%; left:18%; width:22%; height:22%; border-radius:50%; background:rgba(255,255,255,0.7); filter:blur(0.5px); }
.skin-name { font-size:10px; color:rgba(255,255,255,0.65); text-align:center; }
.skin-price { font-size:10px; color:#ffd700; margin-top:2px; }
.skin-check { position:absolute; top:4px; right:4px; width:18px; height:18px; background:#ff8c00; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; }

/* ===== SETTINGS ===== */
.setting-row { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:16px; color:rgba(255,255,255,0.8); }
.toggle-btn { padding:6px 16px; border-radius:20px; border:none; background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.45); font-size:12px; font-weight:700; cursor:pointer; transition:all 0.2s; pointer-events:auto; }
.toggle-btn.active { background:linear-gradient(135deg,#ff8c00,#ff4500); color:#fff; }

/* ===== TUTORIAL ===== */
#tutorial { background:rgba(0,0,0,0.7); }
.tutorial-content { text-align:center; animation:tutorialIn 0.5s ease; }
@keyframes tutorialIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.tutorial-hand { font-size:64px; margin-bottom:16px; animation:handTap 1.5s ease-in-out infinite; }
@keyframes handTap { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-20px) scale(0.9)} }
.tutorial-text { font-size:16px; line-height:1.6; color:rgba(255,255,255,0.8); margin-bottom:32px; text-shadow:0 2px 8px rgba(0,0,0,0.5); }

/* ===== RESPONSIVE ===== */
@media (max-height:600px) { .game-title{font-size:34px} .menu-glass{padding:20px 16px} .btn{padding:12px;margin:6px 0} .menu-bubble-demo{width:70px;height:70px;margin-bottom:18px} .score-value{font-size:40px} }
@media (min-height:800px) { .menu-glass{padding:44px 32px} .game-title{font-size:52px} .score-value{font-size:60px} }
.skins-glass::-webkit-scrollbar{display:none} .skins-glass{-ms-overflow-style:none;scrollbar-width:none}
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" tabindex="0"></canvas>
        <div id="ui-layer">
            <div id="main-menu" class="screen active">
                <div class="menu-glass">
                    <h1 class="game-title">ПУЗЫРЁК</h1>
                    <p class="game-subtitle">Всплыви. Не лопни.</p>
                    <div class="menu-bubble-demo" id="menu-bubble"></div>
                    <button class="btn btn-primary" id="btn-play">ИГРАТЬ</button>
                    <button class="btn btn-secondary" id="btn-skins">СКИНЫ</button>
                    <button class="btn btn-secondary" id="btn-settings">НАСТРОЙКИ</button>
                    <div class="best-score">🏆 Рекорд: <span id="menu-best">0</span></div>
                </div>
            </div>

            <div id="hud" class="screen">
                <div class="hud-center">
                    <span class="score-label">ВЫСОТА</span>
                    <span class="score-value" id="hud-score">0</span>
                </div>
                <div class="hud-bottom">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
            </div>

            <div id="game-over" class="screen">
                <div class="menu-glass">
                    <h2 class="dead-title">ЛОПНУЛ!</h2>
                    <div class="dead-bubble" id="dead-bubble"></div>
                    <div class="final-stats">
                        <div class="stat"><span class="stat-label">Высота</span><span class="stat-value" id="final-score">0</span></div>
                        <div class="stat"><span class="stat-label">Рекорд</span><span class="stat-value" id="final-best">0</span></div>
                    </div>
                    <button class="btn btn-primary" id="btn-restart">ЕЩЁ РАЗ</button>
                    <button class="btn btn-secondary" id="btn-menu">МЕНЮ</button>
                </div>
            </div>

            <div id="skins-screen" class="screen">
                <div class="menu-glass skins-glass">
                    <h2 class="screen-title">СКИНЫ</h2>
                    <div class="coins-display">💎 <span id="coins-count">0</span></div>
                    <div class="skins-grid" id="skins-grid"></div>
                    <button class="btn btn-back" id="btn-skins-back">← НАЗАД</button>
                </div>
            </div>

            <div id="settings-screen" class="screen">
                <div class="menu-glass">
                    <h2 class="screen-title">НАСТРОЙКИ</h2>
                    <div class="setting-row"><span>Звук</span><button class="toggle-btn active" id="toggle-sound">ON</button></div>
                    <div class="setting-row"><span>Вибрация</span><button class="toggle-btn active" id="toggle-vibro">ON</button></div>
                    <div class="setting-row"><span>Частицы</span><button class="toggle-btn active" id="toggle-particles">ON</button></div>
                    <button class="btn btn-back" id="btn-settings-back">← НАЗАД</button>
                </div>
            </div>

            <div id="tutorial" class="screen">
                <div class="tutorial-content">
                    <div class="tutorial-hand">👆</div>
                    <p class="tutorial-text">Нажми ЛЕВУЮ половину — пузырёк получит толчок влево<br>Нажми ПРАВУЮ — толчок вправо<br>Скорость падает, тапай в ритме, чтобы маневрировать</p>
                    <button class="btn btn-primary" id="btn-tutorial-ok">ПОНЯТНО</button>
                </div>
            </div>
        </div>
    </div>

    <script>

const Game = {
    canvas: null, ctx: null, width: 0, height: 0, dpr: 1,
    state: 'menu', lastTime: 0, accumulator: 0, tickRate: 1 / 60,
    bubble: null, glass: null, camera: null, world: null,
    score: 0, bestScore: 0, coins: 0,
    settings: { sound: true, vibration: true, particles: true },
    currentSkin: 'default', isPressed: false, touchSide: null,

    init() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.loadSave();
        this.glass = new Glass();
        this.bubble = new Bubble();
        this.camera = new Camera();
        this.setupInput();
        this.lastTime = performance.now();
        requestAnimationFrame((t) => this.loop(t));
    },

    resize() {
        const c = document.getElementById('game-container');
        this.width = c.clientWidth; this.height = c.clientHeight;
        this.canvas.width = this.width * this.dpr;
        this.canvas.height = this.height * this.dpr;
        this.canvas.style.width = this.width + 'px';
        this.canvas.style.height = this.height + 'px';
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
        if (this.glass) this.glass.resize();
        if (this.bubble) this.bubble.resize();
    },

    setupInput() {
        const c = this.canvas;
        const getSide = (e) => {
            const touch = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : (e.touches && e.touches[0] ? e.touches[0] : null);
            const cx = touch ? touch.clientX : e.clientX;
            return cx < window.innerWidth / 2 ? 'left' : 'right';
        };
        const down = (e) => {
            if (this.state !== 'playing') return;
            if (e.type === 'touchstart') e.preventDefault();
            if (this.bubble) this.bubble.clickSide(getSide(e));
        };
        c.addEventListener('mousedown', down);
        c.addEventListener('touchstart', down, { passive: false });
        c.addEventListener('contextmenu', e => e.preventDefault());
    },

    start() {
        this.state = 'playing'; this.score = 0;
        this.bubble.reset(); this.camera.reset();
        if (this.world) this.world.reset();
        this.updateHUD();
        document.getElementById('game-canvas').style.filter = 'none';
    },

    gameOver() {
        this.state = 'gameover';
        if (this.settings.vibration && navigator.vibrate) navigator.vibrate([50, 30, 80]);
        if (this.score > this.bestScore) this.bestScore = this.score;
        this.coins += Math.floor(this.score / 10);
        this.save();
        if (this.world) this.world.createDeathExplosion(this.bubble.x, this.bubble.y, this.bubble.radius);
        if (AudioEngine && AudioEngine.ctx) AudioEngine.play('pop');
        setTimeout(() => {
            document.getElementById('final-score').textContent = Math.floor(this.score);
            document.getElementById('final-best').textContent = this.bestScore;
            showScreen('game-over');
            document.getElementById('game-canvas').style.filter = 'blur(8px) brightness(0.45)';
        }, 400);
    },

    loop(ts) {
        if (this.lastTime === 0) this.lastTime = ts;
        const dt = Math.min((ts - this.lastTime) / 1000, 0.05);
        this.lastTime = ts;
        this.accumulator += dt;
        while (this.accumulator >= this.tickRate) { this.update(this.tickRate); this.accumulator -= this.tickRate; }
        this.render();
        requestAnimationFrame((t) => this.loop(t));
    },

    update(dt) {
        if (this.state === 'playing') {
            this.bubble.update(dt);
            this.camera.update(dt, this.bubble.y);
            if (this.world) this.world.update(dt, this.bubble, this.camera.y);
            const ns = Math.max(0, Math.floor(-this.bubble.y / 100));
            if (ns > this.score) { this.score = ns; this.updateHUD(); }
            if (this.bubble.dead) this.gameOver();
        } else if (this.state === 'gameover' && this.world) {
            this.world.updateParticlesOnly(dt);
        }
    },

    render() {
        const ctx = this.ctx, w = this.width, h = this.height;
        ctx.clearRect(0, 0, w, h);
        this.drawBackground(ctx, w, h);
        ctx.save(); ctx.translate(0, -this.camera.y);
        this.glass.renderBack(ctx, this.camera.y);
        if (this.world) this.world.renderObstacles(ctx, this.camera.y);
        this.bubble.render(ctx);
        if (this.world) this.world.renderParticles(ctx, this.camera.y);
        this.glass.renderFront(ctx, this.camera.y);
        ctx.restore();
        this.drawVignette(ctx, w, h);
    },

    drawBackground(ctx, w, h) {
        const time = Date.now() * 0.0003;
        const hueShift = Math.sin(time) * 8;
        const theme = SkinManager.getTheme();
        const g = ctx.createLinearGradient(0, 0, 0, h);
        theme.stops.forEach((stop, i) => {
            g.addColorStop(i / (theme.stops.length - 1), `hsl(${stop.h + hueShift}, ${stop.s}%, ${stop.l}%)`);
        });
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 5; i++) {
            const ph = time * 0.5 + i * 1.2;
            const x = w * (0.15 + 0.7 * ((Math.sin(ph * 0.7) + 1) / 2));
            const a = 0.012 + Math.sin(ph) * 0.006;
            const rg = ctx.createLinearGradient(x - 30, 0, x + 30, 0);
            rg.addColorStop(0, `rgba(${theme.ray[0]},${theme.ray[1]},${theme.ray[2]},0)`);
            rg.addColorStop(0.5, `rgba(${theme.ray[0]},${theme.ray[1]},${theme.ray[2]},${a})`);
            rg.addColorStop(1, `rgba(${theme.ray[0]},${theme.ray[1]},${theme.ray[2]},0)`);
            ctx.fillStyle = rg; ctx.fillRect(x - 30, 0, 60, h);
        }
        for (let i = 0; i < 3; i++) {
            const y = (time * 25 + i * h / 3) % (h + 100) - 50;
            ctx.fillStyle = `rgba(${theme.wave[0]},${theme.wave[1]},${theme.wave[2]},${0.015 + Math.sin(time + i) * 0.008})`;
            ctx.beginPath(); ctx.moveTo(0, y);
            for (let x = 0; x <= w; x += 20) ctx.lineTo(x, y + Math.sin(x * 0.008 + time + i) * 12);
            ctx.lineTo(w, y + 35); ctx.lineTo(0, y + 35); ctx.closePath(); ctx.fill();
        }
    },

    drawVignette(ctx, w, h) {
        const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.3, w / 2, h / 2, h * 0.85);
        g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.5)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    },

    updateHUD() {
        document.getElementById('hud-score').textContent = this.score;
        document.getElementById('menu-best').textContent = this.bestScore;
        document.getElementById('coins-count').textContent = this.coins;
        const progress = Math.min((this.score % 50) / 50 * 100, 100);
        document.getElementById('progress-fill').style.width = progress + '%';
    },

    loadSave() {
        try {
            const s = JSON.parse(localStorage.getItem('bubble_save') || '{}');
            this.bestScore = s.best || 0; this.coins = s.coins || 0;
            this.currentSkin = s.skin || 'default';
            this.settings = { ...this.settings, ...(s.settings || {}) };
        } catch (e) { }
    },

    save() {
        localStorage.setItem('bubble_save', JSON.stringify({
            best: this.bestScore, coins: this.coins, skin: this.currentSkin,
            settings: this.settings, version: 1
        }));
    }
};

class Bubble {
    constructor() {
        this.radius = 18; this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
        this.state = 'floating'; this.dead = false;
        this.wobblePhase = 0; this.baseSpeed = 120; this.maxSpeed = 350;
        this.glowIntensity = 0; this.impactSquash = 0; this.resize();
    }

    resize() {
        if (Game.state !== 'playing') {
            this.x = Game.width / 2; this.y = Game.height * 0.7;
        }
    }

    reset() {
        this.x = Game.width / 2; this.y = 0; this.vx = 0; this.vy = 0;
        this.state = 'floating'; this.dead = false;
        this.wobblePhase = 0; this.glowIntensity = 0; this.impactSquash = 0;
    }

    clickSide(side) {
        if (this.dead) return;
        this.state = 'moving_to_wall';
        this.targetSide = side;
        const dir = side === 'left' ? -1 : 1;
        this.vx = dir * 420;
        this.glowIntensity = 1.6;
        this.impactSquash = 1.0;
        if (Game.settings.vibration && navigator.vibrate) navigator.vibrate(10);
        if (AudioEngine && AudioEngine.ctx) AudioEngine.play('stick');
    }

    release() {
        if (this.dead) return;
        if (this.state === 'moving_to_wall') {
            this.state = 'floating'; this.glowIntensity = 0.3;
            if (AudioEngine && AudioEngine.ctx) AudioEngine.play('release');
        }
    }

    update(dt) {
        if (this.dead) return;
        this.wobblePhase += dt * 3;
        if (this.glowIntensity > 0) { this.glowIntensity -= dt * 2.2; if (this.glowIntensity < 0) this.glowIntensity = 0; }
        if (this.impactSquash > 0) { this.impactSquash -= dt * 12; if (this.impactSquash < 0) this.impactSquash = 0; }
        const glass = Game.glass;
        const speed = Math.min(this.baseSpeed + Game.score * 1.5, this.maxSpeed);
        const margin = this.radius + 4;

        if (this.state === 'floating') {
            this.vy = -speed;
            this.vx *= Math.pow(0.08, dt);
            this.vx += Math.sin(this.wobblePhase) * 6 * dt;
            this.x += this.vx * dt; this.y += this.vy * dt;
        } else if (this.state === 'moving_to_wall') {
            this.vy = -speed;
            this.vx *= Math.pow(0.22, dt);
            this.x += this.vx * dt; this.y += this.vy * dt;
            if (Math.abs(this.vx) < 25) {
                this.state = 'floating';

class World {

    update(dt, bubble, cameraY) {
        const spawnY = cameraY - Game.height * 0.5;

            this.spawnDistance = Math.max(120, 250 - Game.score * 0.5);
        }
        this.obstacles.forEach(o => o.update(dt));
        this.obstacles = this.obstacles.filter(o => o.y < cameraY + Game.height + 200);
        for (const o of this.obstacles) {
            if (o.checkCollision(bubble)) { bubble.dead = true; Game.camera.addShake(8); if (AudioEngine && AudioEngine.ctx) AudioEngine.play('pop'); break; }
        }
        this.updateParticles(dt);
        if (Game.settings.particles && bubble.state === 'floating' && !bubble.dead) {
            if (Math.random() < 0.2) {
                this.particles.push({ x: bubble.x + (Math.random() - 0.5) * 6, y: bubble.y + bubble.radius + 2, vx: (Math.random() - 0.5) * 10, vy: 6 + Math.random() * 10, life: 0.35 + Math.random() * 0.35, size: 1.2 + Math.random() * 2, color: 'rgba(255,255,255,0.22)', type: 'trail' });

    updateParticlesOnly(dt) { this.updateParticles(dt); }
    updateParticles(dt) {
        this.particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.gravity || 0) * dt; p.life -= dt; p.vx *= 0.98; });

    }

    spawnObstacle(y) {
        const glass = Game.glass;
        let types = ['ice', 'lemon']; if (Game.score > 30) types.push('mint'); if (Game.score > 60) types.push('straw');
        const type = types[Math.floor(Math.random() * types.length)];
        const x = glass.leftX + 40 + Math.random() * (glass.width - 80);
        let obs;
        switch (type) { case 'ice': obs = new IceCube(x, y); break; case 'lemon': obs = new LemonSlice(x, y); break; case 'straw': obs = new Straw(x, y); break; case 'mint': obs = new MintLeaf(x, y); break; }
        const tooClose = this.obstacles.some(o => Math.abs(o.y - y) < 80 && Math.abs(o.x - x) < 60);
        if (!tooClose) this.obstacles.push(obs);
    }

    renderObstacles(ctx, cameraY) { this.obstacles.forEach(o => o.render(ctx)); }

    }
    createReleaseEffect(x, y) {
        if (!Game.settings.particles) return;
        for (let i = 0; i < 3; i++) this.particles.push({ x: x + (Math.random() - 0.5) * 12, y: y + 6, vx: (Math.random() - 0.5) * 18, vy: 10 + Math.random() * 18, life: 0.25 + Math.random() * 0.2, maxLife: 0.45, size: 1.2 + Math.random() * 2.5, color: 'rgba(255,255,255,0.3)', type: 'splash' });
    }

        if (!Game.settings.particles) return;

            const yy = i * s;
            ctx.beginPath(); ctx.moveTo(0, yy); ctx.quadraticCurveTo(s * 0.18, yy + s * 0.1, s * 0.34, yy + s * 0.18); ctx.strokeStyle = 'rgba(46,92,30,0.3)'; ctx.lineWidth = 0.5; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, yy); ctx.quadraticCurveTo(-s * 0.18, yy + s * 0.1, -s * 0.34, yy + s * 0.18); ctx.stroke();
        }
        // Глянцевый блик сверху-слева — крупный, как на фото
        ctx.beginPath(); ctx.ellipse(-s * 0.12, -s * 0.38, s * 0.1, s * 0.38, -0.35, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fill();
        // Второй мягкий блик справа
        ctx.beginPath(); ctx.ellipse(s * 0.18, s * 0.25, s * 0.06, s * 0.22, 0.25, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
        // Тонкая светлая кайма — эффект толщины
        ctx.beginPath(); ctx.ellipse(0, 0, s * 0.46, s * 0.84, 0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 0.8; ctx.stroke();
        ctx.restore();
    }
    checkCollision(bubble) { const dx = bubble.x - this.x, dy = bubble.y - this.y; return Math.sqrt(dx * dx + dy * dy) < this.size * 0.7 + bubble.radius * 0.8; }
}

const AudioEngine = {
    ctx: null, enabled: true,
    init() { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} },
    play(type) { if (!this.ctx || !this.enabled || !Game.settings.sound) return; if (this.ctx.state === 'suspended') this.ctx.resume(); switch(type) { case 'stick': this.playStick(); break; case 'release': this.playRelease(); break; case 'pop': this.playPop(); break; case 'combo': this.playCombo(); break; } },

    playStick() {
        const t = this.ctx.currentTime;
        const o = this.ctx.createOscillator(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
        o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.12);
        f.type = 'lowpass'; f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(120, t + 0.1); f.Q.setValueAtTime(2, t);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
        o.connect(f); f.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + 0.18);
        const o2 = this.ctx.createOscillator(), g2 = this.ctx.createGain();
        o2.type = 'sine'; o2.frequency.setValueAtTime(300, t + 0.03); o2.frequency.exponentialRampToValueAtTime(100, t + 0.1);
        g2.gain.setValueAtTime(0, t + 0.03); g2.gain.linearRampToValueAtTime(0.1, t + 0.05); g2.gain.exponentialRampToValueAtTime(0.01, t + 0.13);
        o2.connect(g2); g2.connect(this.ctx.destination); o2.start(t + 0.03); o2.stop(t + 0.15);
    },

    playRelease() {
        const t = this.ctx.currentTime;
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(250, t); o.frequency.exponentialRampToValueAtTime(450, t + 0.06);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.15, t + 0.015); g.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + 0.12);
        setTimeout(() => { if (!this.ctx) return; const t2 = this.ctx.currentTime; const o2 = this.ctx.createOscillator(), g2 = this.ctx.createGain(); o2.type = 'sine'; o2.frequency.setValueAtTime(380, t2); o2.frequency.exponentialRampToValueAtTime(580, t2 + 0.04); g2.gain.setValueAtTime(0, t2); g2.gain.linearRampToValueAtTime(0.08, t2 + 0.01); g2.gain.exponentialRampToValueAtTime(0.01, t2 + 0.07); o2.connect(g2); g2.connect(this.ctx.destination); o2.start(t2); o2.stop(t2 + 0.1); }, 50);
    },

    playPop() {
        const t = this.ctx.currentTime;
        // Белый шум — короткий резкий всплеск (само лопание)
        const bs = this.ctx.sampleRate * 0.06, b = this.ctx.createBuffer(1, bs, this.ctx.sampleRate), d = b.getChannelData(0);
        for (let i = 0; i < bs; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bs, 2.5);
        const n = this.ctx.createBufferSource(); n.buffer = b;
        const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(2000, t); f.frequency.exponentialRampToValueAtTime(400, t + 0.06); f.Q.setValueAtTime(0.6, t);
        const g = this.ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.55, t + 0.003); g.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
        n.connect(f); f.connect(g); g.connect(this.ctx.destination); n.start(t);
        // Низкий "хлоп" — давление воздуха
        const o = this.ctx.createOscillator(), og = this.ctx.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.1);
        og.gain.setValueAtTime(0, t); og.gain.linearRampToValueAtTime(0.5, t + 0.004); og.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
        o.connect(og); og.connect(this.ctx.destination); o.start(t); o.stop(t + 0.15);
        // Лёгкий щелчок оболочки
        const o2 = this.ctx.createOscillator(), g2 = this.ctx.createGain();
        o2.type = 'triangle'; o2.frequency.setValueAtTime(800, t); o2.frequency.exponentialRampToValueAtTime(200, t + 0.04);
        g2.gain.setValueAtTime(0, t); g2.gain.linearRampToValueAtTime(0.15, t + 0.002); g2.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
        o2.connect(g2); g2.connect(this.ctx.destination); o2.start(t); o2.stop(t + 0.06);
    },

    playCombo() {
        const t = this.ctx.currentTime, notes = [523, 659, 784, 1047];
        notes.forEach((fr, i) => { const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(fr, t + i * 0.08); g.gain.setValueAtTime(0, t + i * 0.08); g.gain.linearRampToValueAtTime(0.12, t + i * 0.08 + 0.02); g.gain.exponentialRampToValueAtTime(0.01, t + i * 0.08 + 0.25); o.connect(g); g.connect(this.ctx.destination); o.start(t + i * 0.08); o.stop(t + i * 0.08 + 0.3); });
    }
};

function showScreen(name) {
    document.querySelectorAll('#ui-layer .screen').forEach(s => s.classList.remove('active'));
    const t = document.getElementById(name);
    if (t) { t.classList.add('active'); }
    const canvas = document.getElementById('game-canvas');
    if (name === 'main-menu' || name === 'skins-screen' || name === 'settings-screen') {
        canvas.style.filter = 'blur(14px) brightness(0.55)';
    } else if (name === 'hud') {
        canvas.style.filter = 'none';
    } else if (name === 'game-over') {
        canvas.style.filter = 'blur(8px) brightness(0.45)';
    }
}
function hideAllScreens() { document.querySelectorAll('#ui-layer .screen').forEach(s => s.classList.remove('active')); }

    AudioEngine.init(); SkinManager.init(); Game.world = new World(); Game.init();
    showScreen('main-menu'); Game.updateHUD();

    document.getElementById('btn-play').addEventListener('click', () => {
        if (AudioEngine && AudioEngine.ctx) AudioEngine.play('release');
        if (!localStorage.getItem('bubble_played')) { showScreen('tutorial'); }
        else { hideAllScreens(); showScreen('hud'); Game.start(); }
    });
    document.getElementById('btn-skins').addEventListener('click', () => { if (AudioEngine && AudioEngine.ctx) AudioEngine.play('stick'); SkinManager.renderGrid(); showScreen('skins-screen'); });

    document.getElementById('btn-tutorial-ok').addEventListener('click', () => { localStorage.setItem('bubble_played', 'true'); if (AudioEngine && AudioEngine.ctx) AudioEngine.play('release'); hideAllScreens(); showScreen('hud'); Game.start(); });
    document.getElementById('btn-restart').addEventListener('click', () => { if (AudioEngine && AudioEngine.ctx) AudioEngine.play('release'); hideAllScreens(); showScreen('hud'); Game.start(); });
    document.getElementById('btn-menu').addEventListener('click', () => { if (AudioEngine && AudioEngine.ctx) AudioEngine.play('stick'); showScreen('main-menu'); Game.updateHUD(); });
    document.getElementById('btn-skins-back').addEventListener('click', () => { if (AudioEngine && AudioEngine.ctx) AudioEngine.play('stick'); showScreen('main-menu'); });
    document.getElementById('btn-settings-back').addEventListener('click', () => { if (AudioEngine && AudioEngine.ctx) AudioEngine.play('stick'); Game.save(); showScreen('main-menu'); });

    document.getElementById('toggle-sound').addEventListener('click', function() { Game.settings.sound = !Game.settings.sound; this.classList.toggle('active'); this.textContent = Game.settings.sound ? 'ON' : 'OFF'; if (Game.settings.sound && AudioEngine && AudioEngine.ctx) AudioEngine.play('release'); });
    document.getElementById('toggle-vibro').addEventListener('click', function() { Game.settings.vibration = !Game.settings.vibration; this.classList.toggle('active'); this.textContent = Game.settings.vibration ? 'ON' : 'OFF'; });
    document.getElementById('toggle-particles').addEventListener('click', function() { Game.settings.particles = !Game.settings.particles; this.classList.toggle('active'); this.textContent = Game.settings.particles ? 'ON' : 'OFF'; });

    function updateSettingsUI() { const s = Game.settings, ut = (id, v) => { const b = document.getElementById(id); b.classList.toggle('active', v); b.textContent = v ? 'ON' : 'OFF'; }; ut('toggle-sound', s.sound); ut('toggle-vibro', s.vibration); ut('toggle-particles', s.particles); }

    document.addEventListener('keydown', (e) => {
        if (Game.state !== 'playing' || !Game.bubble) return;
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowLeft' || e.code === 'KeyA') {
            Game.bubble.clickSide('left');
        } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
            Game.bubble.clickSide('right');
        }
    });
    document.addEventListener('touchmove', (e) => { if (Game.state === 'playing') e.preventDefault(); }, { passive: false });
    // Новое касание всегда перехватывает управление
    document.addEventListener('touchstart', (e) => {
        if (Game.state === 'playing' && Game.bubble && e.changedTouches && e.changedTouches[0]) {
            const cx = e.changedTouches[0].clientX;
            const side = cx < window.innerWidth / 2 ? 'left' : 'right';
            Game.bubble.clickSide(side);
        }
    }, { passive: false });
});
